name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and published data
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          python build/validate_data.py
          rm -rf node_modules
      # Гейт выкладки: снимок не публикуется, если в нём нашлось хоть что-то из закрытого
      # GPQA-diamond. Проверяется весь снимок, а не отдельный срез. Эталоны (сам бенчмарк и
      # исходный корпус) лежат вне репозитория, поэтому здесь работает структурная часть:
      # имена файлов, поля бенчмарка, принадлежность каждой трассы срезу native-PO.
      - name: Запрет публикации GPQA
        run: python build/check_no_gpqa.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
